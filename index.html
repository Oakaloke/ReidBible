<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReidBible | Coming Soon</title>
<meta name="description" content="ReidBible is coming soon.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at top,#2a2118 0%,#120e0a 70%);color:#f3eadb;font-family:Inter,sans-serif}
.wrap{max-width:620px}
.cross{width:34px;height:52px;margin:0 auto 28px;position:relative}
.cross:before,.cross:after{content:"";position:absolute;background:#d4a94f;border-radius:2px}
.cross:before{left:15px;top:0;width:4px;height:52px}
.cross:after{left:3px;top:14px;width:28px;height:4px}
h1{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(48px,10vw,84px)}
h1 span{color:#d4a94f}
.soon{margin-top:10px;text-transform:uppercase;letter-spacing:6px;font-size:13px;color:#b9a888}
blockquote{margin:44px auto 0;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(20px,4vw,26px);line-height:1.5;color:#e9dcc4}
cite{display:block;margin-top:12px;font-style:normal;font-family:Inter,sans-serif;font-size:13px;letter-spacing:2px;color:#d4a94f}
footer{margin-top:56px;font-size:12px;color:#7d6f5b}
</style>
</head>
<body>
<div class="wrap">
<div class="cross"></div>
<h1>Reid<span>Bible</span></h1>
<p class="soon">Coming Soon</p>
<blockquote>Thy word is a lamp unto my feet, and a light unto my path.<cite>PSALM 119:105</cite></blockquote>
<footer>&copy; 2026 ReidBible.com</footer>
</div>
</body>
